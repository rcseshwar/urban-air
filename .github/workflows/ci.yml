name: CI & Code Quality Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit-and-test:
    name: Build, Lint & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Code Quality - Static Typecheck
        run: npm run typecheck

      - name: Code Quality - ESLint Scan
        run: npm run lint

      - name: Run Vitest Unit & Integration Tests
        run: npm test

      - name: Production Build Check
        run: npm run build
